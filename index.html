      #riven-chat-toggle { border: 1.5px solid #fff !important; box-shadow: none !important; }
      #riven-chat-fab {

        opacity: 0;
        pointer-events: none;
        transition: transform 0.25s ease, opacity 0.25s ease;
      }
      #riven-chat-panel.open {
        transform: translateY(0) scale(1);
        opacity: 1;
        pointer-events: auto;
      }
      .riven-chat-header {
        padding: 14px 16px;
        background: #000;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .riven-chat-avatar {

        border-radius: 50%;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 14px;
        color: white;
        flex-shrink: 0;
      }
      .riven-chat-header-info h4 {

        color: white;
        margin: 0 0 2px;
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      }

        margin: 0;
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      }

    <script>
      (function() {
        var toggle = document.getElementById('riven-chat-toggle');
        var panel = document.getElementById('riven-chat-panel');
        var lineBtn = document.getElementById('line-qr-btn');
        var lineQR = document.getElementById('line-qr-popup');

        toggle.addEventListener('click', function(e) {
          e.stopPropagation();
          var isOpen = panel.classList.contains('open');
          panel.classList.toggle('open', !isOpen);
          toggle.classList.toggle('open', !isOpen);
          if (isOpen) lineQR.classList.remove('show');
        });

        lineBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          lineQR.classList.toggle('show');
        });

        document.addEventListener('click', function(e) {
          if (!document.getElementById('riven-chat-fab').contains(e.target)) {
            panel.classList.remove('open');
            toggle.classList.remove('open');
            lineQR.classList.remove('show');
          }
        });
      })();
    </script>
